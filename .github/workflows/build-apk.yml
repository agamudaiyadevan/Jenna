name: Build Jenna APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Jenna project
        run: |
          unzip -q JENNA_PHONE_CLOUD_BUILD.zip -d jenna-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle -p jenna-project :app:assembleDebug

      - name: Upload Jenna APK
        uses: actions/upload-artifact@v4
        with:
          name: Jenna-APK
          path: jenna-project/app/build/outputs/apk/debug/app-debug.apk
